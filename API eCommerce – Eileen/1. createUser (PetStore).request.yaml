$kind: http-request
url: "{{baseUrl}}/user"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id": 101,
      "username": "{{username}}",
      "firstName": "Eileen",
      "lastName": "QA",
      "email": "eileen.qa@ejemplo.com",
      "password": "{{password}}",
      "phone": "999888777",
      "userStatus": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Tiempo de respuesta menor a 800ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(800);
      });
    language: text/javascript
order: 1000
