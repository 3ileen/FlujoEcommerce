$kind: http-request
url: "{{baseUrl}}/user/{{username}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id": 101,
      "username": "{{username}}",
      "firstName": "Eileen Actualizada",
      "lastName": "QA",
      "email": "eileen.actualizada@ejemplo.com",
      "password": "{{password}}",
      "phone": "987654321",
      "userStatus": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
